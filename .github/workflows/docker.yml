name: Docker

# Build-only check: the image is never pushed from here. Images are
# published by release.yml, from v* tags only.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Read version
        run: echo "RELEASE=$(cut -d \"'\" -f 2 alerta/version.py)" >> $GITHUB_ENV
      - name: Build Image
        run: >-
          docker build
          --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          --build-arg BUILD_NUMBER=${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}
          --build-arg RELEASE=$RELEASE
          --build-arg VERSION=${{ github.sha }}
          -t alerta-api:ci .

name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: alerta
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cut -d "'" -f 2 alerta/version.py)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match alerta/version.py (${version})"
            exit 1
          fi
          echo "Releasing ${version}"
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install .
      - name: Pre-commit hooks
        run: |
          pre-commit run -a --show-diff-on-failure
      - name: Test with pytest
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/alerta
        run: |
          pytest --cov=alerta tests/*.py

  release:
    name: Publish
    needs: test
    runs-on: ubuntu-latest

    # Trusted Publishing: PyPI authenticates this workflow via OIDC, no token.
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Build
        run: |
          python3 -m pip install --upgrade build twine
          python3 -m build
          python3 -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Test Install
        run: |
          python3 -m pip install --upgrade alerta-ng-server
          python3 -m pip freeze

  docker:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      REPOSITORY_URL: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/alerta-api
      BUILD_NUMBER: ${{ format('{0}-{1}-{2}', github.run_id, github.run_number, github.run_attempt) }}

    steps:
      - uses: actions/checkout@v4
      - name: Read version
        run: echo "RELEASE=$(cut -d \"'\" -f 2 alerta/version.py)" >> $GITHUB_ENV
      - name: Build Image
        run: >-
          docker build
          --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          --build-arg BUILD_NUMBER=$BUILD_NUMBER
          --build-arg RELEASE=$RELEASE
          --build-arg VERSION=${{ github.sha }}
          -t $IMAGE_NAME
          -t $REPOSITORY_URL/$IMAGE_NAME:$RELEASE
          -t $REPOSITORY_URL/$IMAGE_NAME:$(git rev-parse --short HEAD)
          -t $REPOSITORY_URL/$IMAGE_NAME:latest .
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REPOSITORY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Image
        run: docker push --all-tags $REPOSITORY_URL/$IMAGE_NAME

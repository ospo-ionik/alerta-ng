name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: alerta
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cut -d "'" -f 2 alerta/version.py)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match alerta/version.py (${version})"
            exit 1
          fi
          echo "Releasing ${version}"
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install .
      - name: Pre-commit hooks
        run: |
          pre-commit run -a --show-diff-on-failure
      - name: Test with pytest
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/alerta
        run: |
          pytest --cov=alerta tests/*.py

  release:
    name: Publish
    needs: test
    runs-on: ubuntu-latest

    # Trusted Publishing: PyPI authenticates this workflow via OIDC, no token.
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Build
        run: |
          python3 -m pip install --upgrade build twine
          python3 -m build
          python3 -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Test Install
        run: |
          python3 -m pip install --upgrade alerta-ng-server
          python3 -m pip freeze
